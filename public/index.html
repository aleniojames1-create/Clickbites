<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClickBites - Calbayog City Local Food Discovery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .masonry-grid{column-count:1;column-gap:1.25rem}@media(min-width:640px){.masonry-grid{column-count:2}}@media(min-width:1024px){.masonry-grid{column-count:3}}@media(min-width:1280px){.masonry-grid{column-count:4}}.masonry-item{break-inside:avoid;margin-bottom:1.25rem}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-12">
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-2 cursor-pointer" onclick="resetFilters()">
      <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-md"><i class="fa-solid fa-utensils"></i></div>
      <div><h1 class="text-xl font-black text-gray-900 tracking-tight leading-none">Click<span class="text-orange-500">Bites</span></h1><p class="text-xs text-gray-500 font-medium tracking-wide">Calbayog City</p></div>
    </div>
    <div class="flex-1 max-w-xl"><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i><input id="searchInput" oninput="loadProducts()" placeholder="Search local dishes, categories, or restaurants in Calbayog..." class="w-full pl-10 pr-4 py-2 bg-gray-100 border border-transparent rounded-full focus:bg-white focus:border-orange-500 focus:outline-none transition-all text-sm"></div></div>
    <div class="flex items-center gap-2" id="topActions">
      <button onclick="openAuth('login')" class="px-3.5 py-2 bg-orange-50 text-orange-600 font-semibold rounded-full text-xs hover:bg-orange-100 transition-colors flex items-center gap-1.5"><i class="fa-solid fa-user"></i><span class="hidden sm:inline">Login</span></button>
      <button onclick="openAuth('register')" class="px-3.5 py-2 bg-orange-500 text-white font-semibold rounded-full text-xs hover:bg-orange-600 transition-colors"><span class="hidden sm:inline">Create Account</span><span class="sm:hidden">Sign up</span></button>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-4 py-2 border-t border-gray-100 flex items-center gap-3 overflow-x-auto no-scrollbar text-xs">
    <span class="font-bold text-gray-500 uppercase tracking-wider text-[10px] shrink-0"><i class="fa-solid fa-filter mr-1"></i>Filters:</span>
    <select id="categoryFilter" onchange="loadProducts()" class="bg-gray-100 rounded-lg px-3 py-1.5 font-medium border-0 focus:ring-2 focus:ring-orange-500 text-gray-700"><option value="All">All Categories</option><option value="Seafood">Seafood</option><option value="Native Delicacy">Native Delicacies</option><option value="Fast Food">Fast Food / Snacks</option><option value="Cafe">Cafes & Desserts</option></select>
    <select id="priceFilter" onchange="loadProducts()" class="bg-gray-100 rounded-lg px-3 py-1.5 font-medium border-0 focus:ring-2 focus:ring-orange-500 text-gray-700"><option value="All">Any Price</option><option value="₱">₱ (Budget Friendly)</option><option value="₱₱">₱₱ (Mid-Range)</option><option value="₱₱₱">₱₱₱ (Premium)</option></select>
    <select id="ratingFilter" onchange="loadProducts()" class="bg-gray-100 rounded-lg px-3 py-1.5 font-medium border-0 focus:ring-2 focus:ring-orange-500 text-gray-700"><option value="0">All Ratings</option><option value="4.5">4.5★ & Above</option><option value="4.0">4.0★ & Above</option></select>
    <label class="flex items-center gap-1.5 bg-gray-100 px-3 py-1.5 rounded-lg cursor-pointer shrink-0"><input type="checkbox" id="openNowFilter" onchange="loadProducts()" class="accent-orange-500 rounded"><span class="font-medium text-gray-700">Open Now Only</span></label>
    <button onclick="openCart()" class="ml-auto shrink-0 px-3 py-1.5 rounded-lg bg-gray-900 text-white font-bold"><i class="fa-solid fa-cart-shopping mr-1"></i>Cart <span id="cartCount" class="ml-1">0</span></button>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 mt-6">
  <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white p-4 sm:p-6 rounded-2xl mb-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div><h2 class="text-xl sm:text-2xl font-black">Discover Calbayog's Best Local Food</h2><p class="text-orange-100 text-xs sm:text-sm mt-1">Explore local shops, browse products, place orders, and pay securely online.</p></div>
    <div class="bg-white/20 backdrop-blur-sm px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0"><i class="fa-solid fa-shield-halved mr-1"></i>Secure marketplace</div>
  </div>
  <div id="productGrid" class="masonry-grid"></div>
  <div id="noResults" class="hidden text-center py-16"><div class="w-16 h-16 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl"><i class="fa-solid fa-utensils"></i></div><h3 class="text-lg font-bold text-gray-700">No food items found</h3><p class="text-xs text-gray-500 mt-1">Try adjusting your search terms or filter settings.</p></div>
</main>

<!-- generic overlay -->
<div id="overlay" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto"><div id="panel" class="bg-white rounded-3xl max-w-5xl w-full overflow-hidden shadow-2xl relative my-auto"></div></div>
<div id="toast" class="fixed bottom-4 right-4 z-[70] hidden max-w-sm bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl text-sm"></div>

<script>
const state={token:localStorage.getItem('clickbites_token'),user:null,products:[],cart:null,currentShop:null,currentProduct:null,location:null,loginChallenge:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
const money=c=>`₱${(Number(c||0)/100).toFixed(2)}`;
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function deviceId(){let id=localStorage.getItem('clickbites_device_id');if(!id){id=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;localStorage.setItem('clickbites_device_id',id)}return id}
async function captureLocation(){return new Promise(resolve=>{if(!navigator.geolocation)return resolve(null);navigator.geolocation.getCurrentPosition(pos=>{state.location={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};resolve(state.location)},()=>resolve(null),{enableHighAccuracy:true,timeout:7000,maximumAge:300000})})}
async function api(path,opt={}){
  const headers={'Content-Type':'application/json',...(opt.headers||{})};
  headers['X-Device-Id']=deviceId();
  if(state.location){headers['X-Client-Latitude']=String(state.location.latitude);headers['X-Client-Longitude']=String(state.location.longitude);if(state.location.accuracy!=null)headers['X-Client-Accuracy']=String(state.location.accuracy)}
  if(state.token)headers.Authorization=`Bearer ${state.token}`;
  let r;
  try{r=await fetch(path,{...opt,headers})}catch(err){
    throw new Error('Cannot connect to the ClickBites server. Start the backend with "npm run server" in another CMD window, then try again.');
  }
  const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text}}
  if(!r.ok)throw new Error(data.error||`Request failed: ${r.status}`);
  return data;
}
function updateTop(){
  const top=$('topActions');
  if(!top) return;
  if(state.user){
    const name=esc(state.user.profile?.fullName||state.user.email||'Account');
    const roles=Array.isArray(state.user.roles)?state.user.roles:[];
    const isAdmin=roles.some(r=>String(r).toLowerCase()==='admin');
    top.innerHTML=`${isAdmin?`<button onclick=\"openAdmin()\" class=\"px-3.5 py-2 bg-orange-500 text-white font-semibold rounded-full text-xs hover:bg-orange-600 transition-colors flex items-center gap-1.5\"><i class=\"fa-solid fa-gauge-high\"></i><span>Admin Dashboard</span></button>`:''}<button onclick=\"openProfile()\" class=\"px-3.5 py-2 bg-orange-50 text-orange-600 font-semibold rounded-full text-xs hover:bg-orange-100 transition-colors flex items-center gap-1.5\"><i class=\"fa-solid fa-user\"></i><span>${name}</span></button><button onclick=\"logout()\" class=\"px-3.5 py-2 bg-gray-900 text-white font-semibold rounded-full text-xs hover:bg-gray-800\">Logout</button>`;
  }else{
    top.innerHTML=`<button onclick=\"openAuth('login')\" class=\"px-3.5 py-2 bg-orange-50 text-orange-600 font-semibold rounded-full text-xs hover:bg-orange-100 transition-colors flex items-center gap-1.5\"><i class=\"fa-solid fa-user\"></i><span class=\"hidden sm:inline\">Login</span></button><button onclick=\"openAuth('register')\" class=\"px-3.5 py-2 bg-orange-500 text-white font-semibold rounded-full text-xs hover:bg-orange-600 transition-colors\"><span class=\"hidden sm:inline\">Create Account</span><span class=\"sm:hidden\">Sign up</span></button>`;
  }
}
function openPanel(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden');document.body.style.overflow='hidden'}
function closePanel(){$('overlay').classList.add('hidden');$('panel').innerHTML='';document.body.style.overflow='auto'}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closePanel()});

async function loadProducts(){try{const p=new URLSearchParams({q:$('searchInput').value,category:$('categoryFilter').value,priceRange:$('priceFilter').value,minRating:$('ratingFilter').value,openOnly:$('openNowFilter').checked?'true':'false',limit:'50'});const d=await api(`/api/products?${p}`);state.products=d.items;renderProducts(d.items)}catch(e){toast(e.message)}}
function renderProducts(items){const grid=$('productGrid');grid.innerHTML='';$('noResults').classList.toggle('hidden',items.length>0);items.forEach(x=>{const card=document.createElement('div');card.className='masonry-item bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer group';card.innerHTML=`<div class="relative overflow-hidden"><img src="${esc(x.image||'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=600&q=80')}" alt="${esc(x.name)}" class="w-full object-cover max-h-[420px]"><div class="absolute top-3 left-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${x.shop?.status==='Approved'?'bg-emerald-500':'bg-gray-500'} text-white shadow-sm">${x.shop?.status==='Approved'?'Available':'Unavailable'}</span></div><div class="absolute bottom-3 right-3 bg-white/90 backdrop-blur-md px-2 py-0.5 rounded-md text-xs font-bold text-gray-800 shadow-sm">${money(x.priceCents)}</div></div><div class="p-4"><div class="flex items-center justify-between text-[11px] text-gray-400 mb-1"><span>${esc(x.category||'Food')}</span><span class="text-amber-500 font-bold flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> ${Number(x.rating||0).toFixed(1)}</span></div><h3 class="font-bold text-gray-800 group-hover:text-orange-500 transition-colors leading-snug text-sm">${esc(x.name)}</h3><p class="text-xs text-gray-500 mt-1 font-medium flex items-center gap-1"><i class="fa-solid fa-store text-gray-400 text-[10px]"></i>${esc(x.shop?.name||'')}</p><button class="mt-3 w-full bg-gray-50 hover:bg-orange-50 text-gray-800 hover:text-orange-600 py-2 rounded-lg text-xs font-bold">View details</button></div>`;card.onclick=()=>openProduct(x);grid.appendChild(card)})}
function resetFilters(){$('searchInput').value='';$('categoryFilter').value='All';$('priceFilter').value='All';$('ratingFilter').value='0';$('openNowFilter').checked=false;loadProducts()}
function openProduct(x){state.currentProduct=x;openPanel(`<div class="flex flex-col md:flex-row"><div class="md:w-1/2 bg-gray-100"><img src="${esc(x.image||'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=80')}" class="w-full h-72 md:h-full object-cover"></div><div class="md:w-1/2 p-6 flex flex-col justify-between"><div><div class="flex justify-between"><span class="text-orange-600 uppercase tracking-wider text-xs font-bold">${esc(x.category||'')}</span><span class="bg-gray-100 px-2 py-0.5 rounded text-xs font-bold">${money(x.priceCents)}</span></div><h3 class="text-2xl font-black text-gray-900 mt-1">${esc(x.name)}</h3><p class="text-lg font-bold text-orange-500 mt-1">${money(x.priceCents)}</p><div class="flex items-center gap-4 my-3 text-xs border-y border-gray-100 py-2.5"><span class="text-amber-500 font-bold"><i class="fa-solid fa-star mr-1"></i>${Number(x.rating||0).toFixed(1)} / 5.0</span><span class="text-gray-500"><i class="fa-solid fa-box mr-1"></i>${Number(x.stock||0)} in stock</span></div><p class="text-gray-600 text-sm leading-relaxed mb-4">${esc(x.description||'No description')}</p><div class="bg-gray-50 rounded-xl p-3 border border-gray-100 mb-4 text-xs space-y-1.5"><div class="font-bold text-gray-800"><i class="fa-solid fa-shop text-orange-500 mr-1"></i>${esc(x.shop?.name||'')}</div><div class="text-gray-500"><i class="fa-solid fa-location-dot mr-1"></i>${esc(x.shop?.location||'')}</div><div class="text-gray-500"><i class="fa-solid fa-phone mr-1"></i>${esc(x.shop?.contact||'')}</div></div></div><div class="flex gap-2"><button onclick="addToCart(${x.id})" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl text-sm"><i class="fa-solid fa-cart-plus mr-1"></i>Add to cart</button><button onclick="openCart()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded-xl text-sm"><i class="fa-solid fa-cart-shopping"></i></button></div></div></div>`)}

function openAuth(mode='login'){
  const login=mode==='login';
  openPanel(`<div class="max-w-md mx-auto p-6">
    <button onclick="closePanel()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark text-lg"></i></button>
    <div class="text-center mb-5">
      <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-2"><i class="fa-solid ${login?'fa-right-to-bracket':'fa-user-plus'}"></i></div>
      <h3 class="text-xl font-black">${login?'Login to ClickBites':'Create your ClickBites account'}</h3>
      <p class="text-xs text-gray-500 mt-1">${login?'Use your Gmail and password. No OTP is required when logging in.':'Use your Gmail address. We will send a one-time verification code after registration.'}</p>
    </div>
    <form id="authForm" class="space-y-3">
      ${login?'':'<label class="text-xs font-semibold">Full name</label><input name="fullName" autocomplete="name" class="w-full p-3 border rounded-lg" placeholder="Full name" required>'}
      <label class="text-xs font-semibold">Gmail</label>
      <input name="email" type="email" autocomplete="email" class="w-full p-3 border rounded-lg" placeholder="you@gmail.com" pattern="^[^\\s@]+@gmail\\.com$" required>
      <label class="text-xs font-semibold">Password</label>
      <input type="password" name="password" autocomplete="${login?'current-password':'new-password'}" minlength="10" class="w-full p-3 border rounded-lg" placeholder="10+ chars, upper/lower/number/symbol" required>
      ${login?'':'<label class="text-xs font-semibold">Confirm password</label><input type="password" name="confirmPassword" autocomplete="new-password" minlength="10" class="w-full p-3 border rounded-lg" placeholder="Confirm password" required>'}
      <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg">${login?'Login':'Create Account'}</button>
    </form>
    <div class="text-center text-xs mt-4 space-y-2">
      <button class="text-orange-600 font-semibold" onclick="openAuth('${login?'register':'login'}')">${login?'Create an account':'Already have an account?'}</button><br>
      <button class="text-gray-500" onclick="openReset()">Forgot password?</button>
    </div>
  </div>`);
  $('authForm').onsubmit=e=>submitAuth(e,login);
}

async function submitAuth(e,login){
  e.preventDefault();
  const fd=new FormData(e.target);
  const email=String(fd.get('email')||'').trim().toLowerCase();
  const password=String(fd.get('password')||'');
  if(!/^[^\s@]+@gmail\.com$/i.test(email)) return toast('Please enter a valid Gmail address, for example you@gmail.com.');
  if(password.length<10 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) return toast('Password must be 10+ characters and include uppercase, lowercase, number, and special character.');
  if(!login && password!==String(fd.get('confirmPassword')||'')) return toast('Passwords do not match.');
  try{
    await captureLocation();
    if(login){
      const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})});
      state.token=d.token;localStorage.setItem('clickbites_token',d.token);state.user=d.user;
      closePanel();updateTop();await refreshCart();toast('Welcome back to ClickBites!');
    }else{
      const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({fullName:fd.get('fullName'),email:fd.get('email'),password:fd.get('password'),confirmPassword:fd.get('confirmPassword')})});
      openRegistrationOtp(d.email,d.maskedEmail);
    }
  }catch(err){
    if(err.message && /verify your Gmail first/i.test(err.message) && fd.get('email')){
      try{
        const email=fd.get('email');
        const d=await api('/api/auth/resend-registration-otp',{method:'POST',body:JSON.stringify({email})});
        openRegistrationOtp(email,d.maskedEmail||'your Gmail');
      }catch(resendErr){toast(resendErr.message)}
    }else toast(err.message);
  }
}

function openRegistrationOtp(email,maskedEmail){
  openPanel(`<div class="max-w-md mx-auto p-6">
    <button onclick="openAuth('register')" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="text-center mb-5">
      <div class="w-12 h-12 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-2"><i class="fa-solid fa-envelope-circle-check"></i></div>
      <h3 class="text-xl font-black">Verify your Gmail</h3>
      <p class="text-xs text-gray-500 mt-1">We sent a 6-digit verification code to <strong>${esc(maskedEmail||email)}</strong>.</p>
    </div>
    <form id="registrationOtpForm" class="space-y-3">
      <input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" class="w-full p-3 border rounded-lg text-center tracking-[0.5em] text-xl" placeholder="000000" required>
      <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg">Verify Gmail & Continue</button>
    </form>
    <div class="text-center mt-4">
      <button id="resendRegistrationOtp" class="text-orange-600 text-xs font-semibold">Resend verification code</button>
      <p class="text-[11px] text-gray-400 mt-2">The code expires after ${Number(window.OTP_MINUTES||10)} minutes. Never share your code.</p>
    </div>
  </div>`);

  $('registrationOtpForm').onsubmit=async e=>{
    e.preventDefault();
    try{
      const otp=new FormData(e.target).get('otp');
      const d=await api('/api/auth/verify-registration-otp',{method:'POST',body:JSON.stringify({email,otp})});
      state.token=d.token;localStorage.setItem('clickbites_token',d.token);state.user=d.user;
      closePanel();updateTop();await refreshCart();toast('Gmail verified! Your account is ready.');
    }catch(err){toast(err.message)}
  };
  $('resendRegistrationOtp').onclick=async()=>{
    try{
      const d=await api('/api/auth/resend-registration-otp',{method:'POST',body:JSON.stringify({email})});
      toast(`New verification code sent to ${d.maskedEmail||'your Gmail'}`);
    }catch(err){toast(err.message)}
  };
}

function openReset(){
  openPanel(`<div class="max-w-md mx-auto p-6">
    <button onclick="closePanel()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
    <h3 class="text-xl font-black">Password recovery</h3>
    <p class="text-xs text-gray-500 mt-1">Enter your registered email. A 6-digit OTP will be sent through Gmail/SMTP. The OTP is required before your password can be changed.</p>
    <form id="resetReq" class="space-y-3 mt-4">
      <input name="identifier" type="email" class="w-full p-3 border rounded-lg" placeholder="you@gmail.com" required>
      <button class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg">Send recovery OTP</button>
    </form>
  </div>`);
  $('resetReq').onsubmit=async e=>{
    e.preventDefault();
    const identifier=new FormData(e.target).get('identifier');
    try{
      const d=await api('/api/auth/request-password-reset',{method:'POST',body:JSON.stringify({identifier})});
      openResetForm(d.maskedEmail||'your email',identifier);
    }catch(err){toast(err.message)}
  };
}
function openResetForm(maskedEmail='',email=''){
  openPanel(`<div class="max-w-md mx-auto p-6">
    <button onclick="openReset()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button>
    <h3 class="text-xl font-black">Set a new password</h3>
    <p class="text-xs text-gray-500 mt-1">Enter the OTP sent to ${esc(maskedEmail)} and choose a strong new password.</p>
    <form id="resetForm" class="space-y-3 mt-4">
      <input name="email" type="email" value="${esc(email)}" class="w-full p-3 border rounded-lg" required>
      <input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" class="w-full p-3 border rounded-lg text-center tracking-[0.5em]" placeholder="6-digit OTP" required>
      <input name="newPassword" type="password" minlength="10" class="w-full p-3 border rounded-lg" placeholder="10+ chars, upper/lower/number/symbol" required>
      <input name="confirmPassword" type="password" minlength="10" class="w-full p-3 border rounded-lg" placeholder="Confirm new password" required>
      <button class="w-full bg-orange-500 text-white font-bold py-3 rounded-lg">Reset password</button>
    </form>
  </div>`);
  $('resetForm').onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    try{
      await api('/api/auth/reset-password',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});
      toast('Password reset successfully. Please log in again.');
      openAuth('login');
    }catch(err){toast(err.message)}
  };
}
function logout(){state.token=null;state.user=null;state.cart=null;localStorage.removeItem('clickbites_token');closePanel();updateTop();$('cartCount').textContent='0';toast('Logged out')}

async function refreshCart(){if(!state.token){$('cartCount').textContent='0';return}try{const d=await api('/api/cart');state.cart=d; $('cartCount').textContent=d.items.reduce((a,x)=>a+x.quantity,0)}catch(e){console.warn(e.message)}}
async function addToCart(id){if(!state.token)return openAuth('login');try{await api('/api/cart/items',{method:'POST',body:JSON.stringify({productId:id,quantity:1})});await refreshCart();closePanel();toast('Added to cart')}catch(e){toast(e.message)}}
async function openCart(){if(!state.token)return openAuth('login');await refreshCart();openPanel(`<div class="max-w-3xl mx-auto p-6"><div class="flex items-center justify-between"><h3 class="text-xl font-black">Your Cart</h3><button onclick="closePanel()" class="text-gray-400"><i class="fa-solid fa-xmark"></i></button></div><div id="cartBody" class="mt-4">Loading…</div></div>`);renderCart();}
function renderCart(){const body=$('cartBody');if(!state.cart?.items?.length){body.innerHTML='<div class="py-10 text-center text-gray-400">Your cart is empty.</div>';return}const subtotal=state.cart.items.reduce((a,x)=>a+x.price_cents*x.quantity,0);body.innerHTML=`<div class="space-y-3">${state.cart.items.map(x=>`<div class="flex items-center justify-between border rounded-xl p-3"><div><div class="font-bold text-sm">${esc(x.name)}</div><div class="text-xs text-gray-500">${esc(x.shop_name)} · ${money(x.price_cents)}</div></div><div class="flex items-center gap-2"><input type="number" min="1" max="${x.stock}" value="${x.quantity}" onchange="changeCart(${x.id},this.value)" class="w-16 border rounded-lg px-2 py-1 text-sm"><button onclick="removeCart(${x.id})" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button></div></div>`).join('')}</div><div class="mt-5 border-t pt-4"><div class="flex justify-between font-bold">Subtotal <span>${money(subtotal)}</span></div><button onclick="startCheckout()" class="w-full mt-3 bg-orange-500 text-white py-3 rounded-xl font-bold">Checkout</button></div>`}
async function changeCart(id,q){try{await api(`/api/cart/items/${id}`,{method:'PUT',body:JSON.stringify({quantity:Number(q)})});await refreshCart();renderCart()}catch(e){toast(e.message)}}
async function removeCart(id){try{await api(`/api/cart/items/${id}`,{method:'DELETE'});await refreshCart();renderCart()}catch(e){toast(e.message)}}
async function startCheckout(){const addresses=await api('/api/addresses');if(!addresses.addresses.length){return openProfile('addresses')}const html=`<div class="max-w-xl mx-auto p-6"><button onclick="openCart()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">Checkout</h3><form id="checkoutForm" class="space-y-3 mt-5"><label class="text-xs font-semibold">Delivery address</label><select name="addressId" class="w-full p-3 border rounded-lg">${addresses.addresses.map(a=>`<option value="${a.id}">${esc(a.label)} · ${esc(a.recipient_name)} · ${esc(a.line1)}, ${esc(a.city)}</option>`).join('')}</select><label class="text-xs font-semibold">Payment method</label><select name="method" class="w-full p-3 border rounded-lg"><option value="GCASH">GCash</option><option value="MAYA">Maya</option><option value="COD">Cash on Delivery</option></select><textarea name="notes" class="w-full p-3 border rounded-lg" placeholder="Order notes (optional)"></textarea><button class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">Place order</button></form><p class="text-[11px] text-gray-400 mt-3">Online payments redirect to the payment provider. ClickBites does not store wallet passwords, PINs, or OTPs.</p></div>`;openPanel(html);$('checkoutForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const d=await api('/api/orders',{method:'POST',body:JSON.stringify({addressId:Number(fd.get('addressId')),notes:fd.get('notes')})});if(fd.get('method')==='COD'){for(const o of d.orders)await api(`/api/orders/${o.id}/status`,{method:'PUT',body:JSON.stringify({status:'confirmed'})});closePanel();await refreshCart();toast(`${d.orders.length} order${d.orders.length===1?'':'s'} placed successfully`)}else{const first=d.orders[0];const pay=await api('/api/payments/checkout',{method:'POST',body:JSON.stringify({orderId:first.id,method:fd.get('method')})});if(pay.checkoutUrl)location.href=pay.checkoutUrl}}catch(err){toast(err.message)}}}

function openProfile(tab='profile'){if(!state.user)return openAuth('login');api('/api/addresses').then(d=>{openPanel(`<div class="max-w-3xl mx-auto p-6"><button onclick="closePanel()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button><h3 class="text-xl font-black">My Account</h3><div class="mt-5 grid md:grid-cols-3 gap-4"><div class="space-y-2"><button onclick="profileTab('profile')" class="w-full text-left p-3 bg-gray-50 rounded-lg font-semibold">Profile</button><button onclick="profileTab('password')" class="w-full text-left p-3 bg-gray-50 rounded-lg font-semibold">Password</button><button onclick="profileTab('addresses')" class="w-full text-left p-3 bg-gray-50 rounded-lg font-semibold">Addresses</button><button onclick="openMyShops()" class="w-full text-left p-3 bg-gray-50 rounded-lg font-semibold">My Shops</button></div><div id="profileTab" class="md:col-span-2"></div></div></div>`);profileTab(tab,d.addresses)}).catch(e=>toast(e.message))}
function profileTab(tab,addresses=[]){const box=$('profileTab');if(tab==='profile'){box.innerHTML=`<form id="profileForm" class="space-y-3"><label class="text-xs font-semibold">Full name</label><input name="fullName" value="${esc(state.user.profile?.fullName||'')}" class="w-full p-3 border rounded-lg"><label class="text-xs font-semibold">Email</label><input name="email" value="${esc(state.user.email||'')}" class="w-full p-3 border rounded-lg"><label class="text-xs font-semibold">Mobile</label><input name="mobile" value="${esc(state.user.mobile||'')}" class="w-full p-3 border rounded-lg"><label class="text-xs font-semibold">Birth date</label><input type="date" name="birthDate" value="${esc(state.user.profile?.birthDate||'')}" class="w-full p-3 border rounded-lg"><label class="text-xs font-semibold">Gender</label><input name="gender" value="${esc(state.user.profile?.gender||'')}" class="w-full p-3 border rounded-lg"><button type="button" onclick="captureAndSaveLocation()" class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-bold"><i class="fa-solid fa-location-crosshairs mr-1"></i> Save current GPS location</button><p class="text-[11px] text-gray-400">GPS is used as a security signal for unusual sign-ins. Your exact location is not shown publicly.</p><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Save details</button></form>`;$('profileForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const d=await api('/api/me',{method:'PUT',body:JSON.stringify(Object.fromEntries(fd))});state.user=d.user;updateTop();toast('Profile updated')}catch(err){toast(err.message)}}}else if(tab==='password'){box.innerHTML=`<form id="passwordForm" class="space-y-3"><input name="currentPassword" type="password" class="w-full p-3 border rounded-lg" placeholder="Current password" required><input name="newPassword" type="password" class="w-full p-3 border rounded-lg" placeholder="10+ chars, upper/lower/number/symbol" required><input name="confirmPassword" type="password" class="w-full p-3 border rounded-lg" placeholder="Confirm new password" required><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Change password</button></form>`;$('passwordForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/me/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Password changed')}catch(err){toast(err.message)}}}else{box.innerHTML=`<div class="space-y-3">${addresses.map(a=>`<div class="border rounded-xl p-3 text-xs"><div class="font-bold">${esc(a.label)} ${a.is_default?'· Default':''}</div><div>${esc(a.recipient_name)} · ${esc(a.recipient_phone)}</div><div>${esc(a.line1)}, ${esc(a.city)} ${esc(a.province||'')}</div></div>`).join('')}<button onclick="addAddressForm()" class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Add address</button></div>`}}
async function captureAndSaveLocation(){const loc=await captureLocation();if(!loc)return toast('Location permission was not available. Allow location access and try again.');try{await api('/api/me/location',{method:'POST',body:JSON.stringify(loc)});toast('Current GPS location saved securely')}catch(e){toast(e.message)}}
function addAddressForm(){const box=$('profileTab');box.innerHTML=`<form id="addressForm" class="space-y-3"><input name="label" class="w-full p-3 border rounded-lg" placeholder="Home / Work"><input name="recipientName" class="w-full p-3 border rounded-lg" placeholder="Recipient name"><input name="recipientPhone" class="w-full p-3 border rounded-lg" placeholder="Phone"><input name="line1" class="w-full p-3 border rounded-lg" placeholder="Street / building / unit"><input name="barangay" class="w-full p-3 border rounded-lg" placeholder="Barangay"><input name="city" class="w-full p-3 border rounded-lg" placeholder="City"><input name="province" class="w-full p-3 border rounded-lg" placeholder="Province"><input name="postalCode" class="w-full p-3 border rounded-lg" placeholder="Postal code"><label class="text-xs"><input type="checkbox" name="isDefault"> Make default</label><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Save address</button></form>`;$('addressForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/addresses',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});openProfile('addresses');toast('Address saved')}catch(err){toast(err.message)}}}

async function openOrders(){if(!state.token)return openAuth('login');const d=await api('/api/orders');openPanel(`<div class="max-w-4xl mx-auto p-6"><button onclick="closePanel()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button><h3 class="text-xl font-black">My Orders</h3><div class="mt-4 space-y-3">${d.orders.map(o=>`<button onclick="viewOrder(${o.id})" class="w-full text-left border rounded-xl p-4 hover:bg-orange-50"><div class="flex justify-between"><span class="font-bold">${esc(o.orderNumber)}</span><span class="text-xs font-semibold">${esc(o.orderStatus)}</span></div><div class="text-xs text-gray-500">${esc(o.shop.name)} · ${money(o.totalCents)} · ${esc(o.paymentStatus)}</div><div class="text-[11px] text-gray-400 mt-1">${esc(o.createdAt)}</div></button>`).join('')||'<div class="py-10 text-center text-gray-400">No orders yet.</div>'}</div></div>`)}
async function viewOrder(id){const d=await api(`/api/orders/${id}`);const o=d.order;openPanel(`<div class="max-w-3xl mx-auto p-6"><button onclick="openOrders()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">${esc(o.orderNumber)}</h3><div class="mt-5 border rounded-xl p-4"><div class="font-bold">${esc(o.shop.name)}</div><div class="text-xs text-gray-500 mt-1">${esc(o.orderStatus)} · ${esc(o.paymentStatus)}</div></div><div class="mt-4 space-y-2">${o.items.map(i=>`<div class="flex justify-between text-sm"><span>${esc(i.product_name)} × ${i.quantity}</span><span>${money(i.line_total_cents)}</span></div>`).join('')}</div><div class="mt-4 border-t pt-4 flex justify-between font-black">Total <span>${money(o.totalCents)}</span></div>${o.paymentStatus!=='paid'&&o.paymentMethod!=='COD'?'<button onclick="payOrder('+o.id+',\'GCASH\')" class="w-full mt-4 bg-orange-500 text-white py-3 rounded-xl font-bold">Continue online payment</button>':''}</div>`)}
async function payOrder(id,method){try{const d=await api('/api/payments/checkout',{method:'POST',body:JSON.stringify({orderId:id,method})});location.href=d.checkoutUrl}catch(e){toast(e.message)}}

async function openMyShops(){const d=await api('/api/my/shops');openPanel(`<div class="max-w-5xl mx-auto p-6"><button onclick="closePanel()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button><div class="flex items-center justify-between"><h3 class="text-xl font-black">My Shops</h3><button onclick="openCreateShop()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Create shop</button></div><div class="grid md:grid-cols-2 gap-3 mt-5">${d.shops.map(s=>`<button onclick="openShopDashboard(${s.id})" class="text-left border rounded-xl p-4 hover:bg-orange-50"><div class="font-bold">${esc(s.name)}</div><div class="text-xs text-gray-500">${esc(s.category||'')} · ${esc(s.status)}</div><div class="text-[11px] text-gray-400 mt-1">${esc(s.location||'')}</div></button>`).join('')||'<div class="col-span-2 py-10 text-center text-gray-400">No shops yet.</div>'}</div></div>`)}
async function openCreateShop(){const cats=await api('/api/categories');const shops=cats.categories.filter(c=>c.type==='shop');openPanel(`<div class="max-w-2xl mx-auto p-6"><button onclick="openMyShops()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">Create a Shop</h3><form id="shopForm" class="space-y-3 mt-5"><input name="name" class="w-full p-3 border rounded-lg" placeholder="Shop name" required><select name="categoryId" class="w-full p-3 border rounded-lg"><option value="">Select shop category</option>${shops.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><textarea name="description" class="w-full p-3 border rounded-lg" placeholder="Description"></textarea><input name="location" class="w-full p-3 border rounded-lg" placeholder="Location"><input name="contactNumber" class="w-full p-3 border rounded-lg" placeholder="Contact number"><input name="contactEmail" class="w-full p-3 border rounded-lg" placeholder="Contact email"><input name="externalUrl" class="w-full p-3 border rounded-lg" placeholder="Facebook / official page URL"><input name="operatingHours" class="w-full p-3 border rounded-lg" placeholder="Operating hours"><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Submit for approval</button></form></div>`);$('shopForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/shops',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});openMyShops();toast('Shop submitted for admin approval')}catch(err){toast(err.message)}}}
async function openShopDashboard(id){const d=await api(`/api/my/shops/${id}/dashboard`);const products=await api(`/api/my/shops/${id}/products`);state.currentShop=id;openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="openMyShops()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black">Shop Dashboard</h3><div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">${[['Products',d.stats.total_products],['Available',d.stats.available_products],['Orders',d.stats.total_orders],['Pending',d.stats.pending_orders],['Sales',d.stats.grossSales]].map(([a,b])=>`<div class="bg-gray-50 rounded-xl p-3"><div class="text-[11px] text-gray-400">${a}</div><div class="font-black mt-1">${esc(b)}</div></div>`).join('')}</div><div class="flex gap-2 mt-5"><button onclick="openCreateProduct(${id})" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Add product</button><button onclick="openShopBuyers(${id})" class="bg-gray-100 px-4 py-2 rounded-lg text-sm font-bold">Buyer history</button></div><div class="mt-5 space-y-2">${products.products.map(p=>`<div class="border rounded-xl p-3 flex justify-between gap-3"><div><div class="font-bold text-sm">${esc(p.name)}</div><div class="text-xs text-gray-500">${money(p.price_cents)} · stock ${p.stock} · ${esc(p.status)}</div></div><button onclick="editProduct(${p.id},${id})" class="text-orange-600 text-xs font-bold">Edit</button></div>`).join('')||'<div class="py-10 text-center text-gray-400">No products yet.</div>'}</div></div>`)}
async function openCreateProduct(shopId){const cats=await api('/api/categories');const pcats=cats.categories.filter(c=>c.type==='product');openPanel(`<div class="max-w-xl mx-auto p-6"><button onclick="openShopDashboard(${shopId})" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">Add Product</h3><form id="productForm" class="space-y-3 mt-5"><input name="name" required class="w-full p-3 border rounded-lg" placeholder="Product name"><select name="categoryId" class="w-full p-3 border rounded-lg"><option value="">Category</option>${pcats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><textarea name="description" class="w-full p-3 border rounded-lg" placeholder="Description"></textarea><input name="priceCents" type="number" min="0" class="w-full p-3 border rounded-lg" placeholder="Price in centavos (e.g. 18000)"><input name="stock" type="number" min="0" class="w-full p-3 border rounded-lg" placeholder="Stock"><select name="status" class="w-full p-3 border rounded-lg"><option value="available">Available</option><option value="unavailable">Unavailable</option><option value="sold_out">Sold out</option></select><input name="externalUrl" class="w-full p-3 border rounded-lg" placeholder="Optional product page URL"><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Save product</button></form></div>`);$('productForm').onsubmit=async e=>{e.preventDefault();try{await api(`/api/my/shops/${shopId}/products`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});openShopDashboard(shopId);toast('Product saved')}catch(err){toast(err.message)}}}
async function editProduct(id,shopId){const d=await api(`/api/my/shops/${shopId}/products`);const p=d.products.find(x=>x.id===id);if(!p)return;openPanel(`<div class="max-w-xl mx-auto p-6"><button onclick="openShopDashboard(${shopId})" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">Edit Product</h3><form id="editProduct" class="space-y-3 mt-5"><input name="name" value="${esc(p.name)}" class="w-full p-3 border rounded-lg"><textarea name="description" class="w-full p-3 border rounded-lg">${esc(p.description||'')}</textarea><input name="priceCents" type="number" value="${p.price_cents}" class="w-full p-3 border rounded-lg"><input name="stock" type="number" value="${p.stock}" class="w-full p-3 border rounded-lg"><select name="status" class="w-full p-3 border rounded-lg"><option ${p.status==='available'?'selected':''} value="available">Available</option><option ${p.status==='unavailable'?'selected':''} value="unavailable">Unavailable</option><option ${p.status==='sold_out'?'selected':''} value="sold_out">Sold out</option></select><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Update product</button><button type="button" onclick="deleteProduct(${id},${shopId})" class="w-full bg-red-50 text-red-600 py-3 rounded-lg font-bold">Delete</button></form></div>`);$('editProduct').onsubmit=async e=>{e.preventDefault();try{await api(`/api/products/${id}`,{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});openShopDashboard(shopId);toast('Product updated')}catch(err){toast(err.message)}}}
async function deleteProduct(id,shopId){if(!confirm('Delete this product?'))return;try{await api(`/api/products/${id}`,{method:'DELETE'});openShopDashboard(shopId);toast('Product deleted')}catch(e){toast(e.message)}}
async function openShopBuyers(id){const d=await api(`/api/my/shops/${id}/buyers`);openPanel(`<div class="max-w-5xl mx-auto p-6"><button onclick="openShopDashboard(${id})" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">Buyer History</h3><div class="mt-5 overflow-auto"><table class="w-full text-xs"><thead><tr class="text-left border-b"><th class="p-2">Buyer</th><th class="p-2">Order</th><th class="p-2">Amount</th><th class="p-2">Payment</th><th class="p-2">Status</th><th class="p-2">Date</th></tr></thead><tbody>${d.buyers.map(x=>`<tr class="border-b"><td class="p-2">${esc(x.full_name||'')}</td><td class="p-2">${esc(x.order_number)}</td><td class="p-2">${money(x.total_cents)}</td><td class="p-2">${esc(x.payment_status)}</td><td class="p-2">${esc(x.order_status)}</td><td class="p-2">${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`)}

async function openAdmin(){const d=await api('/api/admin/dashboard');openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="closePanel()" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button><div class="flex items-center justify-between"><h3 class="text-xl font-black">Admin Dashboard</h3><span class="text-xs text-gray-400">Authorized admin only</span></div><div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">${Object.entries(d.stats).map(([k,v])=>`<div class="bg-gray-50 rounded-xl p-3"><div class="text-[10px] uppercase text-gray-400">${esc(k.replaceAll(/([A-Z])/g,' $1'))}</div><div class="font-black mt-1 text-sm">${esc(v)}</div></div>`).join('')}</div><div class="grid md:grid-cols-2 gap-3 mt-5"><button onclick="adminShops()" class="p-4 bg-orange-50 rounded-xl font-bold text-left">Shop approvals</button><button onclick="adminProducts()" class="p-4 bg-gray-50 rounded-xl font-bold text-left">Menu items</button><button onclick="adminOrders()" class="p-4 bg-gray-50 rounded-xl font-bold text-left">Orders</button><button onclick="adminPayments()" class="p-4 bg-gray-50 rounded-xl font-bold text-left">Payments</button><button onclick="adminRevenue()" class="p-4 bg-gray-50 rounded-xl font-bold text-left">Revenue & top shops</button><button onclick="adminCreateShop()" class="p-4 bg-gray-50 rounded-xl font-bold text-left">Create shop for an existing user</button></div></div>`)}
async function adminShops(){const d=await api('/api/admin/shops?limit=100');openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="openAdmin()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black">Shop Approvals</h3><div class="mt-4 space-y-2">${d.shops.map(s=>`<div class="border rounded-xl p-4"><div class="flex justify-between gap-3"><div><div class="font-bold">${esc(s.name)}</div><div class="text-xs text-gray-500">Owner: ${esc(s.owner_name||'')} · ${esc(s.owner_email||'')} · ${esc(s.owner_mobile||'')}</div><div class="text-xs text-gray-500">${esc(s.location||'')} · ${esc(s.status)}</div></div><div class="flex gap-2"><button onclick="setShopStatus(${s.id},'Approved')" class="px-3 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold">Approve</button><button onclick="setShopStatus(${s.id},'Disapproved')" class="px-3 py-1 bg-red-50 text-red-700 rounded-lg text-xs font-bold">Disapprove</button><button onclick="setShopStatus(${s.id},'Suspended')" class="px-3 py-1 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold">Suspend</button></div></div></div>`).join('')}</div></div>`)}
async function setShopStatus(id,status){const reason=status==='Disapproved'?prompt('Reason for disapproval?')||'':null;try{await api(`/api/admin/shops/${id}/status`,{method:'PUT',body:JSON.stringify({status,reason})});adminShops();toast(`Shop marked ${status}`)}catch(e){toast(e.message)}}
async function adminProducts(){const d=await api('/api/admin/products?limit=100');openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="openAdmin()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black">Admin Menu Items</h3><div class="mt-4 overflow-auto"><table class="w-full text-xs"><thead><tr class="border-b text-left"><th class="p-2">Product</th><th class="p-2">Shop</th><th class="p-2">Owner</th><th class="p-2">Price</th><th class="p-2">Stock</th><th class="p-2">Status</th><th class="p-2">Created</th></tr></thead><tbody>${d.products.map(x=>`<tr class="border-b"><td class="p-2 font-semibold">${esc(x.name)}</td><td class="p-2">${esc(x.shop_name)}</td><td class="p-2">${esc(x.owner_name||'')}</td><td class="p-2">${money(x.price_cents)}</td><td class="p-2">${x.stock}</td><td class="p-2">${esc(x.status)}</td><td class="p-2">${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function adminOrders(){const d=await api('/api/admin/orders?limit=100');openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="openAdmin()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black">Admin Orders</h3><div class="mt-4 overflow-auto"><table class="w-full text-xs"><thead><tr class="border-b text-left"><th class="p-2">Order</th><th class="p-2">Buyer</th><th class="p-2">Shop</th><th class="p-2">Amount</th><th class="p-2">Payment</th><th class="p-2">Order status</th><th class="p-2">Date</th></tr></thead><tbody>${d.orders.map(x=>`<tr class="border-b"><td class="p-2">${esc(x.order_number)}</td><td class="p-2">${esc(x.buyer_name||'')}</td><td class="p-2">${esc(x.shop_name)}</td><td class="p-2">${money(x.total_cents)}</td><td class="p-2">${esc(x.payment_status)}</td><td class="p-2">${esc(x.order_status)}</td><td class="p-2">${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function adminPayments(){const d=await api('/api/admin/payments');openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="openAdmin()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black">Admin Payments</h3><div class="mt-4 overflow-auto"><table class="w-full text-xs"><thead><tr class="border-b text-left"><th class="p-2">Payment</th><th class="p-2">Order</th><th class="p-2">Buyer</th><th class="p-2">Shop</th><th class="p-2">Method</th><th class="p-2">Amount</th><th class="p-2">Status</th></tr></thead><tbody>${d.payments.map(x=>`<tr class="border-b"><td class="p-2">${x.id}</td><td class="p-2">${esc(x.order_number)}</td><td class="p-2">${esc(x.buyer_name||'')}</td><td class="p-2">${esc(x.shop_name)}</td><td class="p-2">${esc(x.method)}</td><td class="p-2">${money(x.amount_cents)}</td><td class="p-2">${esc(x.status)}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function adminRevenue(){const d=await api('/api/admin/revenue');openPanel(`<div class="max-w-6xl mx-auto p-6"><button onclick="openAdmin()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black">Revenue Report</h3><div class="grid grid-cols-2 md:grid-cols-5 gap-3 mt-5">${Object.entries(d.summary).map(([k,v])=>`<div class="bg-gray-50 rounded-xl p-3"><div class="text-[10px] text-gray-400 uppercase">${esc(k)}</div><div class="font-black">${esc(v)}</div></div>`).join('')}</div><div class="mt-5 overflow-auto"><table class="w-full text-xs"><thead><tr class="border-b text-left"><th class="p-2">Shop</th><th class="p-2">Orders</th><th class="p-2">Gross sales</th><th class="p-2">Shop earnings</th><th class="p-2">Commission</th></tr></thead><tbody>${d.topShops.map(x=>`<tr class="border-b"><td class="p-2 font-semibold">${esc(x.name)}</td><td class="p-2">${x.total_orders}</td><td class="p-2">${esc(x.grossSales)}</td><td class="p-2">${esc(x.shopEarnings)}</td><td class="p-2">${esc(x.platformCommission)}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function adminCreateShop(){openPanel(`<div class="max-w-xl mx-auto p-6"><button onclick="openAdmin()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="text-xl font-black text-center">Create Shop for Existing User</h3><form id="adminShopForm" class="space-y-3 mt-5"><input name="identifier" class="w-full p-3 border rounded-lg" placeholder="Existing user's email, mobile, or user ID" required><input name="name" class="w-full p-3 border rounded-lg" placeholder="Shop name" required><textarea name="description" class="w-full p-3 border rounded-lg" placeholder="Description"></textarea><input name="location" class="w-full p-3 border rounded-lg" placeholder="Location"><input name="contactNumber" class="w-full p-3 border rounded-lg" placeholder="Contact number"><input name="contactEmail" class="w-full p-3 border rounded-lg" placeholder="Contact email"><select name="status" class="w-full p-3 border rounded-lg"><option>Pending</option><option>Approved</option></select><button class="w-full bg-orange-500 text-white py-3 rounded-lg font-bold">Create and link shop</button></form></div>`);$('adminShopForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/shops',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});openAdmin();toast('Shop created and linked to existing account')}catch(err){toast(err.message)}}}

async function handlePaymentReturn(){const qs=new URLSearchParams(location.search);const id=qs.get('payment_return');if(!id)return;if(!state.token)return;try{const d=await api(`/api/orders/${id}`);const pending=d.order.payments.find(p=>p.status==='pending');if(pending){await api(`/api/payments/${pending.id}/verify`,{method:'POST'});}history.replaceState({},'',location.pathname);await refreshCart();toast('Payment status refreshed');viewOrder(id)}catch(e){toast(e.message)}}
async function init(){try{if(state.token){const d=await api('/api/me');state.user=d.user;updateTop();await refreshCart()}else updateTop();}catch{logout()}await loadProducts();await handlePaymentReturn()}
init();
</script>
</body>
